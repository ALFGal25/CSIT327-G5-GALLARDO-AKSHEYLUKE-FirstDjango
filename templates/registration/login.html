{% extends "base.html" %}

{% block content %}
<h2>Log in</h2>
<p class="muted">Your retro game shelf, finally organized.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Log in</button>
</form>
<p>No account? <a href="{% url 'signup' %}">Sign up</a></p>
{% endblock %}

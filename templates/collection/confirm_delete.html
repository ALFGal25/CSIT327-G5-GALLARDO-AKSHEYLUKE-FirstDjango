{% extends "base.html" %}

{% block content %}
<h2>Delete this game?</h2>
<p>Are you sure you want to delete <strong>{{ object.title }}</strong> ({{ object.get_platform_display }})?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a class="btn btn-light" href="javascript:history.back()">Cancel</a>
</form>
{% endblock %}
